name: Release

# Builds Spectrum.app for a version tag and attaches the dmg and zip to its GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v0.1.0
        required: true

permissions:
  contents: write

jobs:
  app:
    runs-on: macos-15
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Test
        run: swift test
      - name: Bundle
        run: scripts/bundle.sh "${TAG#v}"
      - name: Upload
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
          gh release upload "$TAG" "dist/Spectrum-${TAG#v}.dmg" "dist/Spectrum-${TAG#v}.zip" --clobber
